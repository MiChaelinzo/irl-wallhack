[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "irl-wallhack"
version = "0.1.0"
description = "Local WiFi sensing dashboard: presence, motion and breathing from signal changes"
requires-python = ">=3.9"
dependencies = ["fastapi>=0.100", "uvicorn[standard]>=0.23", "numpy>=1.21"]

[project.optional-dependencies]
sensors = ["pyserial>=3.5", "smbus2>=0.4"]

[project.scripts]
wallhack = "wallhack.__main__:main"

[tool.setuptools]
packages = ["wallhack", "wallhack.collectors", "wallhack.sensors"]

[tool.setuptools.package-data]
wallhack = ["static/*"]
