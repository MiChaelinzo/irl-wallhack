[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "irl-wallhack"
version = "0.1.0"
description = "Local WiFi sensing dashboard: presence, motion and breathing from signal changes"
requires-python = ">=3.9"
dependencies = ["fastapi", "uvicorn[standard]"]

[project.scripts]
wallhack = "wallhack.__main__:main"

[tool.setuptools]
packages = ["wallhack", "wallhack.collectors"]

[tool.setuptools.package-data]
wallhack = ["static/*"]
